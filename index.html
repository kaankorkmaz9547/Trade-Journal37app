
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Journal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-5">

<div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold mb-2">Trade Journal</h1>
    <p class="text-slate-400 mb-8">Trading performance tracker</p>

    <div id="auth" class="bg-slate-900 p-6 rounded-xl max-w-md">
        <h2 class="text-xl font-bold mb-4">Hesabına Giriş Yap</h2>
        <input id="email" type="email" placeholder="E-posta"
        class="w-full p-3 mb-3 rounded bg-slate-800">
        <input id="password" type="password" placeholder="Şifre"
        class="w-full p-3 mb-4 rounded bg-slate-800">
        <button onclick="login()" class="bg-blue-600 p-3 rounded w-full mb-2">Giriş Yap</button>
        <button onclick="signup()" class="bg-slate-700 p-3 rounded w-full">Kayıt Ol</button>
        <p id="message" class="mt-4 text-sm text-slate-300"></p>
    </div>

    <div id="app" class="hidden">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold">İşlem Günlüğüm</h2>
            <button onclick="logout()" class="bg-red-600 px-4 py-2 rounded">Çıkış</button>
        </div>

        <div class="bg-slate-900 p-5 rounded-xl mb-6">
            <h3 class="font-bold mb-4">Yeni İşlem Ekle</h3>
            <input id="symbol" placeholder="Parite / Enstrüman"
            class="w-full p-3 mb-3 rounded bg-slate-800">
            <select id="direction" class="w-full p-3 mb-3 rounded bg-slate-800">
                <option value="Long">Long</option>
                <option value="Short">Short</option>
            </select>
            <input id="entry" type="number" step="any" placeholder="Giriş fiyatı"
            class="w-full p-3 mb-3 rounded bg-slate-800">
            <input id="exit" type="number" step="any" placeholder="Çıkış fiyatı"
            class="w-full p-3 mb-3 rounded bg-slate-800">
            <input id="result" type="number" step="any" placeholder="Kâr / Zarar ($)"
            class="w-full p-3 mb-3 rounded bg-slate-800">
            <textarea id="notes" placeholder="İşlem notları"
            class="w-full p-3 mb-3 rounded bg-slate-800"></textarea>
            <button onclick="addTrade()" class="bg-blue-600 p-3 rounded w-full">İşlemi Kaydet</button>
            <p id="tradeMessage" class="mt-3 text-sm"></p>
        </div>

        <div class="bg-slate-900 p-5 rounded-xl">
            <h3 class="font-bold mb-4">Geçmiş İşlemler</h3>
            <div id="trades" class="space-y-3"></div>
        </div>
    </div>
</div>

<script>
const SUPABASE_URL = "https://kpomcxbdfkdjglbuurlj.supabase.co";
const SUPABASE_KEY = "sb_publishable_pDlu9-L7mp7yL7bUsXtQCg_RY4uONyA";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function login() {
    const {error} = await db.auth.signInWithPassword({
        email: email.value,
        password: password.value
    });
    message.textContent = error ? error.message : "Giriş başarılı!";
    if (!error) showApp();
}

async function signup() {
    const {error} = await db.auth.signUp({
        email: email.value,
        password: password.value
    });
    message.textContent = error ? error.message : "Kayıt başarılı! E-postanı kontrol et.";
}

async function logout() {
    await db.auth.signOut();
    location.reload();
}

async function showApp() {
    auth.classList.add("hidden");
    app.classList.remove("hidden");
    await loadTrades();
}

async function addTrade() {
    const {data: {user}} = await db.auth.getUser();
    if (!user) return;

    const {error} = await db.from("trades").insert({
        user_id: user.id,
        symbol: symbol.value,
        direction: direction.value,
        entry: Number(entry.value),
        exit: Number(exit.value),
        result: Number(result.value),
        notes: notes.value
    });

    tradeMessage.textContent = error ? error.message : "İşlem kaydedildi!";
    if (!error) {
        symbol.value = "";
        entry.value = "";
        exit.value = "";
        result.value = "";
        notes.value = "";
        await loadTrades();
    }
}

async function loadTrades() {
    const {data, error} = await db.from("trades")
        .select("*").order("created_at", {ascending:false});

    if (error) {
        trades.textContent = error.message;
        return;
    }

    trades.innerHTML = "";
    data.forEach(t => {
        const item = document.createElement("div");
        item.className = "bg-slate-800 p-4 rounded-lg";
        const heading = document.createElement("strong");
        heading.textContent = `${t.symbol} - ${t.direction}`;
        const details = document.createElement("p");
        details.className = "text-slate-300 mt-2";
        details.textContent = `Giriş: ${t.entry} | Çıkış: ${t.exit} | Sonuç: ${t.result}$`;
        const note = document.createElement("p");
        note.className = "text-slate-400 mt-2";
        note.textContent = t.notes || "";
        item.append(heading, details, note);
        trades.appendChild(item);
    });
}

async function checkSession() {
    const {data} = await db.auth.getSession();
    if (data.session) showApp();
}

checkSession();
</script>
</body>
</html>
